<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;background:#05010f;font-family:Inter;color:#fff;overflow:hidden;position:relative}
.foto{position:absolute;right:-120px;top:0;width:1008px;height:1350px;background:url(thays_salao_roxo.jpg) center/cover;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 35%),linear-gradient(0deg,transparent 0%,#000 25%);-webkit-mask-composite:source-in}
.glow{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,1,15,.95) 0%,rgba(5,1,15,.8) 40%,rgba(5,1,15,.2) 62%,transparent 75%),radial-gradient(700px 600px at 90% 10%,rgba(124,58,237,.45),transparent 60%),radial-gradient(600px 500px at 0% 100%,rgba(0,212,255,.18),transparent 60%)}
.top{position:absolute;top:80px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center}
.marca{display:flex;align-items:center;gap:18px;font:700 30px Poppins}.logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(140deg,#7c3aed,#2a0b5e);box-shadow:0 0 0 2px rgba(0,212,255,.55);font:800 26px Poppins;color:#00d4ff}
.k{font:600 24px Poppins;letter-spacing:3px;color:#00d4ff;text-transform:uppercase}
.txt{position:absolute;left:80px;top:330px;width:600px;display:flex;flex-direction:column;gap:34px}
h1{font:800 66px/1.06 Poppins;letter-spacing:-1.5px}h1 em{font-style:normal;color:#00d4ff}
.bolha{align-self:flex-start;background:#202c33;border-radius:8px 28px 28px 28px;padding:22px 28px;font-size:30px;line-height:1.35;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.bolha small{display:block;font-size:22px;color:#8696a0;margin-top:6px;text-align:right}
.cta{align-self:flex-start;background:linear-gradient(120deg,#7c3aed,#9d4edd);padding:26px 42px;border-radius:999px;font:700 34px Poppins;box-shadow:0 20px 60px rgba(124,58,237,.55)}
.nota{position:absolute;left:80px;bottom:70px;font-size:22px;color:#8b80ad}
</style></head><body><div class="foto"></div><div class="glow"></div>
<div class="top"><div class="marca"><div class="logo">CH</div>CH Automações</div><div class="k">Salões de beleza</div></div>
<div class="txt"><h1>Você está com a cliente na cadeira. <em>A Thays marca a próxima.</em></h1>
<div class="bolha">Oi! Para escova amanhã, tenho 10h ou 16h30. Qual prefere?<small>Thays · 21:47</small></div>
<div class="cta">Teste grátis por 15 dias</div></div>
<div class="nota">Personagem virtual criada com IA · Conversa ilustrativa · @chautomacoes</div>
</body></html>
