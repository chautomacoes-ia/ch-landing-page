<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  :root { --bg:#05010f; --roxo:#7c3aed; --roxo2:#9d4edd; --ciano:#00d4ff; --mut:#b7abd9; --linha:#2a1b4d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: 'Inter', 'Noto Color Emoji', sans-serif; color: #fff; }
  .foto { position: absolute; inset: 0; background-position: center; background-size: cover; background-repeat: no-repeat; transform-origin: 50% 40%; opacity: 0; }
  .veu { position: absolute; inset: 0; z-index: 10; background: linear-gradient(180deg, rgba(5,1,15,.55) 0%, rgba(5,1,15,0) 18%, rgba(5,1,15,0) 45%, rgba(5,1,15,.82) 64%, rgba(5,1,15,.95) 100%); }
  .top { z-index: 11; position: absolute; top: 260px; left: 70px; right: 70px; display: flex; justify-content: space-between; align-items: center; }
  .marca { background: rgba(5,1,15,.7); padding: 8px 22px 8px 8px; border-radius: 999px; display: flex; align-items: center; gap: 18px; font-family: 'Poppins'; font-weight: 700; font-size: 32px; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .logo { width: 68px; height: 68px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(140deg, var(--roxo), #2a0b5e); box-shadow: 0 0 0 2px rgba(0,212,255,.55); font-family: 'Poppins'; font-weight: 800; font-size: 28px; color: var(--ciano); }
  .selo { font-size: 24px; color: #e6e0ff; background: rgba(5,1,15,.7); padding: 10px 20px; border-radius: 999px; }
  .zona { z-index: 11; position: absolute; left: 70px; right: 70px; top: 1120px; bottom: 330px; display: flex; flex-direction: column; justify-content: flex-start; gap: 26px; }
  .leg { font-family: 'Poppins'; font-weight: 700; font-size: 58px; line-height: 1.16; letter-spacing: -.5px; text-shadow: 0 3px 18px rgba(0,0,0,.7); }
  .leg em { font-style: normal; color: var(--ciano); }
  .chips { display: flex; flex-wrap: wrap; gap: 16px; }
  .chip { font-size: 36px; font-weight: 600; padding: 16px 26px; border-radius: 999px; background: rgba(18,10,38,.9); border: 2px solid rgba(0,212,255,.5); }
  .card { background: rgba(18,10,38,.92); border: 2px solid var(--linha); border-radius: 30px; padding: 26px 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
  .card.um { grid-template-columns: 1fr; }
  .card div { font-size: 34px; line-height: 1.25; display: flex; gap: 14px; align-items: center; }
  .card i { font-style: normal; flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: rgba(0,212,255,.16); color: var(--ciano); font-weight: 800; font-size: 26px; }
  .final { position: absolute; inset: 0; background: radial-gradient(900px 700px at 80% 10%, rgba(124,58,237,.5), transparent 60%), radial-gradient(700px 600px at 0% 100%, rgba(0,212,255,.18), transparent 60%), #05010f; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; gap: 40px; }
  .final .logo { width: 110px; height: 110px; border-radius: 30px; font-size: 44px; }
  .final h1 { font-family: 'Poppins'; font-weight: 800; font-size: 88px; line-height: 1.05; letter-spacing: -1.5px; }
  .final h1 em { font-style: normal; color: var(--ciano); }
  .final p { font-size: 40px; line-height: 1.4; color: var(--mut); }
  .final .cta { align-self: flex-start; background: linear-gradient(120deg, var(--roxo), var(--roxo2)); padding: 32px 52px; border-radius: 999px; font-family: 'Poppins'; font-weight: 700; font-size: 44px; box-shadow: 0 20px 60px rgba(124,58,237,.55); }
  .final small { font-size: 28px; color: #8b80ad; }
</style></head>
<body>
<div class="foto" id="f0" style="background-image:url(thays_h6.jpg)"></div><div class="foto" id="f1" style="background-image:url(thays_g5.jpg)"></div><div class="foto" id="f2" style="background-image:url(thays_h2.jpg)"></div><div class="foto" id="f3" style="background-image:url(thays_h5.jpg)"></div><div class="foto" id="f4" style="background-image:url(thays_g2.jpg)"></div><div class="foto" id="f5" style="background-image:url(thays_h1.jpg)"></div><div class="veu"></div>
<div class="top" id="top"><div class="marca"><div class="logo">CH</div>CH Automações</div><div class="selo">Personagem virtual criada com IA</div></div>
<div class="zona" id="zona"></div>
<div id="camada" style="position:absolute;inset:0;z-index:12"></div>
<script>
const FIM = 30.0, FIM_FOTO = 26.5;
window.DURACAO = FIM;
const CENAS = [
  [0.0, 4.0, [[0.2, '<div class="leg">Oi! Eu sou a Thays, a <em>atendente de IA</em> da CH Automações.</div>']]],
  [4.0, 8.0, [[0.1, '<div class="leg">Eu atendo os clientes do seu negócio no <em>WhatsApp</em>, a qualquer hora.</div>']]],
  [8.0, 12.5, [[0.1, '<div class="leg">Tiro as dúvidas mais comuns, passo valores quando perguntam e <em>marco horários</em> na sua agenda.</div>']]],
  [12.5, 16.5, [[0.1, '<div class="leg">E falo <em>várias línguas</em>.</div>'], [0.6, '<div class="chips"><span class="chip">Olá!</span><span class="chip">Hello!</span><span class="chip">¡Hola!</span></div>']]],
  [16.5, 22.0, [[0.1, '<div class="leg">A CH também tem o <em>CH Intelligence</em>:</div>'], [0.5, '<div class="card"><div><i>✓</i>Agenda online</div><div><i>✓</i>Funil de vendas</div><div><i>✓</i>Financeiro</div><div><i>✓</i>Fidelidade</div></div>'], [1.3, '<div class="leg" style="font-size:46px">E <em>sites</em> que levam o cliente direto ao seu WhatsApp.</div>']]],
  [22.0, FIM_FOTO, [[0.1, '<div class="leg" style="font-size:50px">O sistema já tem módulos para:</div>'], [0.4, '<div class="card"><div><i>✓</i>Barbearia e salão</div><div><i>✓</i>Clínicas</div><div><i>✓</i>Advocacia</div><div><i>✓</i>Corretor de seguros</div><div><i>✓</i>Academia e pilates</div></div>'], [1.4, '<div class="leg" style="font-size:46px">E a Thays se adapta a <em>outros negócios</em> que atendem pelo WhatsApp.</div>']]],
];
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
window.render = (t) => {
  // zoom lento: aproxima do rosto até 12,5 s, depois abre um pouco
  // uma pose por cena, com troca suave e zoom lento
  const CORTES = [0, 4.0, 8.0, 12.5, 16.5, 22.0, FIM_FOTO];
  for (let i = 0; i < 6; i++) {
    const a = CORTES[i], b = CORTES[i + 1];
    let op = 0;
    if (t >= a - 0.3 && t < b) op = i === 0 ? 1 : Math.min(1, (t - (a - 0.3)) / 0.3);
    if (t >= b && t < b + 0.3 && i < 5) op = 1;
    const k = Math.max(0, Math.min(1, (t - a) / (b - a)));
    const el = document.getElementById('f' + i);
    el.style.opacity = op; el.style.zIndex = i; el.style.transform = `scale(${1.02 + 0.06 * k})`;
  }
  let html = '';
  for (const [a, b, els] of CENAS) {
    if (t < a || t >= b) continue;
    const saida = Math.min(1, (b - t) / 0.35);
    for (const [d, h] of els) {
      const k = ease((t - a - d) / 0.45);
      html += `<div style="opacity:${k * saida};transform:translateY(${(1 - k) * 30}px)">${h}</div>`;
    }
  }
  document.getElementById('zona').innerHTML = html;
  let camada = '';
  if (t >= FIM_FOTO) {
    const a = Math.min(1, (t - FIM_FOTO) / 0.5);
    camada = `<div class="final" style="opacity:${a}"><div class="logo">CH</div><h1>Atendimento, agenda e vendas <em>no mesmo lugar.</em></h1><div class="cta">Fale com a CH · link na bio</div><small>@chautomacoes<br>A Thays é uma personagem virtual criada com IA.</small></div>`;
  }
  document.getElementById('camada').innerHTML = camada;
};
render(0);
</script>
</body></html>
