<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter;color:#fff}

.top{position:absolute;top:150px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
.marca{display:flex;align-items:center;gap:20px;font:700 34px Poppins}.logo{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(140deg,#7c3aed,#2a0b5e);box-shadow:0 0 0 2px rgba(0,212,255,.55);font:800 30px Poppins;color:#00d4ff}
.k{font:600 26px Poppins;letter-spacing:3px;color:#00d4ff;text-transform:uppercase}
.nota{position:absolute;left:60px;top:1236px;font:500 30px Inter;color:#d9d2f0;text-shadow:0 2px 8px rgba(0,0,0,.8)}
