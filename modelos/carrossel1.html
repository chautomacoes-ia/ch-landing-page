<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  :root { --bg:#05010f; --roxo:#7c3aed; --roxo2:#9d4edd; --ciano:#00d4ff; --fg:#ffffff; --mut:#b7abd9; --card:#120a26; --linha:#2a1b4d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; background: var(--bg); font-family: 'Inter', sans-serif; color: var(--fg); overflow: hidden; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 96px 92px; display: flex; flex-direction: column;
    background: radial-gradient(900px 600px at 85% -10%, rgba(124,58,237,.38), transparent 60%), radial-gradient(700px 500px at -10% 110%, rgba(0,212,255,.14), transparent 60%), var(--bg); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(157,78,221,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(157,78,221,.07) 1px, transparent 1px); background-size: 54px 54px; mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent); }
  .top { position: relative; display: flex; justify-content: space-between; align-items: center; }
  .marca { display: flex; align-items: center; gap: 18px; font-family: 'Poppins'; font-weight: 700; font-size: 30px; letter-spacing: .5px; }
  .logo { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(140deg, var(--roxo), #2a0b5e); box-shadow: 0 0 0 2px rgba(0,212,255,.55); font-family: 'Poppins'; font-weight: 800; font-size: 26px; color: var(--ciano); }
  .kicker { font-family: 'Poppins'; font-weight: 600; font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: var(--ciano); }
  .meio { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  h1 { font-family: 'Poppins'; font-weight: 800; font-size: 92px; line-height: 1.04; letter-spacing: -1.5px; }
  h1 em { font-style: normal; color: var(--ciano); }
  h2 { font-family: 'Poppins'; font-weight: 700; font-size: 64px; line-height: 1.1; letter-spacing: -1px; }
  .sub { font-size: 34px; line-height: 1.4; color: var(--mut); max-width: 860px; }
  .num { font-family: 'Poppins'; font-weight: 800; font-size: 150px; line-height: .8; color: transparent; -webkit-text-stroke: 3px var(--roxo2); opacity: .9; }
  .rodape { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: var(--mut); }
  .dots { display: flex; gap: 10px; } .dots i { width: 12px; height: 12px; border-radius: 6px; background: var(--linha); } .dots i.on { width: 36px; background: var(--ciano); }
  /* cartoes de evidencia */
  .card { background: var(--card); border: 2px solid var(--linha); border-radius: 32px; padding: 34px 38px; display: flex; flex-direction: column; gap: 18px; max-width: 820px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .bolha { align-self: flex-start; background: #1e1438; border-radius: 26px 26px 26px 8px; padding: 24px 30px; font-size: 36px; line-height: 1.35; }
  .meta { font-size: 26px; color: var(--mut); display: flex; gap: 14px; align-items: center; }
  .alerta { color: #ff7a93; font-weight: 600; }
  .ok { color: #34d399; font-weight: 600; }
  .linha { display: flex; justify-content: space-between; align-items: center; font-size: 34px; padding: 14px 0; border-bottom: 1px dashed var(--linha); }
  .linha:last-child { border-bottom: 0; }
  .risco { color: var(--mut); text-decoration: line-through; text-decoration-color: #ff7a93; }
  .pill { font-size: 24px; font-weight: 600; padding: 8px 18px; border-radius: 999px; background: rgba(255,122,147,.14); color: #ff7a93; }
  .pill.c { background: rgba(0,212,255,.14); color: var(--ciano); }
  .notif { display: flex; gap: 20px; align-items: center; background: #1a1032; border-radius: 24px; padding: 22px 26px; font-size: 30px; }
  .notif b { font-weight: 700; }
  .ico { width: 54px; height: 54px; border-radius: 14px; background: #25d366; display: grid; place-items: center; font-weight: 800; color: #062; font-size: 28px; flex: none; }
  .grande { font-family: 'Poppins'; font-weight: 800; font-size: 120px; color: var(--ciano); line-height: 1; }
  .cta { display: inline-flex; align-items: center; gap: 18px; align-self: flex-start; background: linear-gradient(120deg, var(--roxo), var(--roxo2)); padding: 30px 46px; border-radius: 999px; font-family: 'Poppins'; font-weight: 700; font-size: 40px; box-shadow: 0 20px 60px rgba(124,58,237,.55); }
  .lista { display: flex; flex-direction: column; gap: 26px; font-size: 40px; line-height: 1.3; }
  .lista div { display: flex; gap: 22px; align-items: flex-start; }
  .lista span.v { flex: none; width: 48px; height: 48px; border-radius: 14px; background: rgba(0,212,255,.16); color: var(--ciano); display: grid; place-items: center; font-weight: 800; font-size: 30px; margin-top: 2px; }
</style></head>
<body>
<div id="raiz"></div>
<script>
const total = 7;
const s = Number(new URLSearchParams(location.search).get('s') || 1);
const dots = Array.from({ length: total }, (_, i) => `<i class="${i + 1 === s ? 'on' : ''}"></i>`).join('');
const topo = (k) => `<div class="top"><div class="marca"><div class="logo">CH</div>CH Automações</div><div class="kicker">${k}</div></div>`;
const pe = (txt) => `<div class="rodape"><span>${txt}</span><div class="dots">${dots}</div></div>`;
const sinal = (n, titulo, sub, card) => `${topo('Sinal ' + n + ' de 5')}<div class="meio"><div class="num">0${n}</div><h2>${titulo}</h2>${card}<p class="sub">${sub}</p></div>${pe('@chautomacoes')}`;
const S = {
  1: `${topo('Clínicas de estética')}<div class="meio"><h1>Sua clínica está <em>perdendo cliente</em> no WhatsApp?</h1><p class="sub">5 sinais que passam despercebidos na correria do dia a dia. Se dois deles acontecem aí, vale continuar lendo.</p></div>${pe('Arraste para o lado →')}`,
  2: sinal(1, 'A paciente pergunta o valor e só recebe resposta no dia seguinte.',
    'Quem responde primeiro costuma levar a cliente. Ela não espera, ela chama a próxima clínica.',
    `<div class="card"><div class="bolha">Oi! Quanto fica a limpeza de pele? Tem horário essa semana?</div><div class="meta">14:32 · <span class="alerta">sem resposta há 19 horas</span></div></div>`),
  3: sinal(2, 'A agenda fica no caderno e ninguém sabe quem faltou.',
    'Sem lembrete na véspera, a falta só aparece quando a cadeira já ficou vazia.',
    `<div class="card"><div class="linha"><span>Qui · 09h00 · Carla M.</span><span class="pill">faltou</span></div><div class="linha"><span class="risco">Qui · 10h30 · Bianca</span><span class="pill">desmarcou</span></div><div class="linha"><span>Qui · 14h00 · ???</span><span class="pill">sem nome</span></div></div>`),
  4: sinal(3, 'Você vende pacote de sessões, mas não sabe quantas cada cliente já usou.',
    'Sem esse controle, ou você esquece de cobrar o que faltou, ou a cliente termina o pacote sem ninguém oferecer o próximo.',
    `<div class="card"><div class="linha"><span>Juliana R. · drenagem</span><span class="pill">sessão ? de 10</span></div><div class="linha"><span>Patrícia S. · peeling</span><span class="pill">sessão ? de 4</span></div><div class="linha"><span>Renata A. · laser</span><span class="pill">pacote vence quando?</span></div></div>`),
  5: sinal(4, 'Você responde mensagem entre um procedimento e outro.',
    'Ou você atende a paciente que está na maca, ou a que está no celular. As duas saem perdendo.',
    `<div class="card" style="gap:16px"><div class="notif"><div class="ico">W</div><div><b>WhatsApp</b> · 12 mensagens não lidas</div></div><div class="notif"><div class="ico">W</div><div><b>Nova conversa</b> · "Vocês fazem drenagem?"</div></div><div class="meta">Em procedimento até 15h40</div></div>`),
  6: sinal(5, 'Você não sabe quantas avaliações viraram tratamento no mês.',
    'Sem esse número, fica impossível saber se o problema está no atendimento, no preço ou no retorno.',
    `<div class="card"><div class="meta">Avaliações que viraram tratamento em outubro</div><div class="grande">?</div></div>`),
  7: `${topo('Como a CH resolve')}<div class="meio"><h2>A Thays atende na hora e o CH Intelligence organiza o resto.</h2><div class="lista"><div><span class="v">✓</span>Responde a paciente em segundos, a qualquer hora</div><div><span class="v">✓</span>Marca a avaliação direto na agenda e lembra na véspera</div><div><span class="v">✓</span>Controla as sessões de cada pacote e avisa quem não voltou</div><div><span class="v">✓</span>Mostra quantas avaliações viraram tratamento</div></div><div class="cta">Chama no WhatsApp · link na bio</div></div>${pe('@chautomacoes')}`,
};
document.getElementById('raiz').innerHTML = `<section class="slide"><div class="grid"></div>${S[s]}</section>`;
</script>
</body></html>
