<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#05010f;font-family:Inter,'Noto Color Emoji';color:#fff;position:relative}
.bg{position:absolute;inset:0;background-size:cover;background-position:center 25%}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,1,15,.55) 0%,rgba(5,1,15,.1) 30%,rgba(5,1,15,.35) 55%,rgba(5,1,15,.95) 80%)}
.glow{position:absolute;inset:0;background:radial-gradient(900px 700px at 90% 0%,rgba(124,58,237,.45),transparent 60%),radial-gradient(800px 700px at 0% 100%,rgba(0,212,255,.16),transparent 60%)}
.top{position:absolute;top:170px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.marca{display:flex;align-items:center;gap:20px;font:700 34px Poppins}.logo{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(140deg,#7c3aed,#2a0b5e);box-shadow:0 0 0 2px rgba(0,212,255,.55);font:800 30px Poppins;color:#00d4ff}
.arroba{font-size:30px;color:#b7abd9}
.cena{position:absolute;left:90px;right:90px;bottom:360px;display:flex;flex-direction:column;gap:34px;z-index:5}
.centro{top:320px;justify-content:center}
h1{font:800 104px/1.03 Poppins;letter-spacing:-2px}h2{font:800 84px/1.06 Poppins;letter-spacing:-1.5px}em{font-style:normal;color:#00d4ff}
.sub{font-size:46px;line-height:1.35;color:#b7abd9}.sub b{color:#fff}
.b{max-width:80%;padding:26px 32px 16px;border-radius:30px;font-size:42px;line-height:1.35}.b small{display:block;text-align:right;font-size:26px;opacity:.6;margin-top:4px}
.cli{align-self:flex-end;background:#005c4b;border-top-right-radius:8px}.th{align-self:flex-start;background:#202c33;border-top-left-radius:8px}
.cta{align-self:flex-start;background:linear-gradient(120deg,#7c3aed,#9d4edd);padding:34px 54px;border-radius:999px;font:700 46px Poppins;box-shadow:0 20px 60px rgba(124,58,237,.55)}
.nota{font-size:28px;color:#8b80ad}
.selo{position:absolute;top:290px;left:90px;z-index:5;font:600 24px Poppins;letter-spacing:2px;color:#00d4ff;text-transform:uppercase}
.barra{position:absolute;left:90px;right:90px;bottom:300px;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;z-index:5}.barra b{display:block;height:100%;background:linear-gradient(90deg,#9d4edd,#00d4ff)}
.aviso{position:absolute;left:90px;right:90px;bottom:240px;font-size:26px;color:#b7abd9;z-index:5}
</style></head><body>
<div class="bg" id="bg"></div><div class="sh" id="sh"></div><div class="glow"></div>
<div class="top"><div class="marca"><div class="logo">CH</div>CH Automações</div><div class="arroba">@chautomacoes</div></div>
<div class="selo" id="selo"></div>
<div class="cena" id="cena"></div>
<div class="barra"><b id="prog"></b></div>
<div class="aviso" id="aviso"></div>
<script>
const FIM=16;window.DURACAO=FIM;
const C=[
 [0,3.8,'thays_h2.jpg','',[[0.1,'<h1>Prazer, eu sou <em>a Thays.</em></h1>'],[0.7,'<p class="sub">A atendente de IA da <b>CH Automações.</b></p>']]],
 [3.8,8.2,'thays_g1.jpg','',[[0.1,'<h2>Eu atendo o WhatsApp <em>do seu negócio.</em></h2>'],[0.8,'<p class="sub">Enquanto você cuida de <b>quem está na sua frente.</b></p>']]],
 [8.2,12.4,'thays_salao_roxo.jpg','',[[0.1,'<h2>Tiro dúvidas e <em>marco na sua agenda.</em></h2>'],[0.8,'<p class="sub">Passo valores quando o cliente pergunta <b>e mostro os horários livres.</b></p>']]],
 [12.4,FIM,'thays_base_v2.jpg','',[[0.1,'<h2>Teste grátis por <em>15 dias.</em></h2>'],[0.7,'<div class="cta">Fale com a CH · link na bio</div>']]],
];
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
window.render=t=>{let h='';for(const [a,b,img,selo,els] of C){if(t<a||t>=b)continue;
 const bg=document.getElementById('bg');const k=(t-a)/(b-a);
 if(img){bg.style.backgroundImage='url('+img+')';bg.style.transform='scale('+(1.05+0.08*k)+')';bg.style.opacity=Math.min(1,(t-a)/0.4);document.getElementById('sh').style.opacity=1}else{bg.style.opacity=0;}
 document.getElementById('selo').textContent=selo;
 document.getElementById('aviso').textContent= img?'Personagem virtual criada com IA':'Conversa ilustrativa. Nomes de exemplo.';
 const out=b===FIM?1:Math.min(1,(b-t)/0.35);
 for(const [d,x] of els){const e=ease((t-a-d)/0.45);h+=`<div style="opacity:${e*out};transform:translateY(${(1-e)*40}px)">${x}</div>`;}}
 document.getElementById('cena').innerHTML=h;document.getElementById('prog').style.width=(100*t/FIM)+'%';};
render(0);
</script></body></html>
